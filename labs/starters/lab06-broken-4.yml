# ---------------------------------------------------------------------------
# Lab 06 broken #4
#
# 症狀：build job 綠色成功，但 package job 失敗。
#       download-artifact 抱怨 artifact name 是空的 / 找不到 artifact。
#
# 你的任務：追出 ${{ needs.build.outputs.jar-name }} 為什麼是空字串，並修好。
# 提示：job 的 outputs 不會自己出現，要「宣告」；
#       而 step 要能被 outputs 引用，必須有 id。
# ---------------------------------------------------------------------------

name: Lab06 Broken 4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: simpleweb-jar
          path: target/simpleweb.jar
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download jar
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.jar-name }}
          path: downloaded

      - name: Inspect
        run: ls -l downloaded
