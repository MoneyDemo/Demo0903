# ---------------------------------------------------------------------------
# Lab 01 starter — 第一個 workflow
#
# 使用方式：
#   1. 把這個檔案複製到你 repo 的 .github/workflows/lab01-hello.yml
#   2. 把每一個 TODO 補完（請自己打字，不要整段貼解答）
#   3. commit + push，然後到 repo 的 Actions 頁面觀看執行結果
#
# 注意：workflow 檔案「一定」要放在 .github/workflows/ 目錄下，
#       放在其他資料夾 GitHub 不會執行它。
# ---------------------------------------------------------------------------

