name: Lab05 Promote to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simpleweb-lab-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify

      - name: Create SHA-256 checksum
        run: |
          set -euo pipefail
          cd target
          sha256sum simpleweb.jar > simpleweb.jar.sha256
          cat simpleweb.jar.sha256

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: simpleweb-jar
          path: target/simpleweb.jar
          if-no-files-found: error
          retention-days: 1

      - name: Publish jar to rolling pre-release build-${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view build-${{ github.sha }} --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create build-${{ github.sha }} \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "build-${{ github.sha }}" \
              --notes "GH-200 lab 用的滾動式建置產出，由 workflow 自動更新。"
          fi
          gh release upload build-${{ github.sha }} \
            target/simpleweb.jar target/simpleweb.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

  deploy-test:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: test
      url: http://${{ vars.VM_PUBLIC_IP }}:8080/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure VM is running
        run: |
          az vm start \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}"

      - name: Deploy to test
        env:
          JAR_URL: https://github.com/${{ github.repository }}/releases/download/build-${{ github.sha }}/simpleweb.jar
          SHA_URL: https://github.com/${{ github.repository }}/releases/download/build-${{ github.sha }}/simpleweb.jar.sha256
        run: |
          set -euo pipefail
          OUT="$(az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --parameters "$JAR_URL" "$SHA_URL" "test" "simpleweb-test" "${{ github.sha }}" \
            --scripts '
              # RunShellScript 用 /bin/sh 執行：POSIX 語法，沒有 pipefail。
              set -eu
              JAR_URL="$1"; SHA_URL="$2"; ENV_DIR="$3"; SERVICE="$4"; SHA="$5"
              STAGING="/opt/simpleweb/staging/$ENV_DIR"
              TARGET="/opt/simpleweb/$ENV_DIR"
              sudo mkdir -p "$STAGING" "$TARGET"
              sudo rm -f "$STAGING/simpleweb.jar" "$STAGING/simpleweb.jar.sha256"
              sudo curl -fsSL -o "$STAGING/simpleweb.jar" "$JAR_URL"
              sudo curl -fsSL -o "$STAGING/simpleweb.jar.sha256" "$SHA_URL"
              cd "$STAGING"
              sudo sha256sum -c simpleweb.jar.sha256
              sudo install -m 0644 -o root -g root "$STAGING/simpleweb.jar" "$TARGET/simpleweb.jar"
              sudo touch "$TARGET/app.env"
              sudo sed -i "/^APP_BUILD_SHA=/d; /^APP_BUILD_TIME=/d" "$TARGET/app.env"
              printf "APP_BUILD_SHA=%s\nAPP_BUILD_TIME=%s\n" "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                | sudo tee -a "$TARGET/app.env" >/dev/null
              sudo chown root:root "$TARGET/app.env"
              sudo chmod 0644 "$TARGET/app.env"
              sudo systemctl restart "$SERVICE"
              sleep 5
              sudo systemctl is-active "$SERVICE"
              echo "DEPLOY_OK $SHA"
            ' \
            --query "value[].message" -o tsv)"
          echo "$OUT"
          if ! printf '%s' "$OUT" | grep -q "DEPLOY_OK ${{ github.sha }}"; then
            echo "❌ RunCommand 回報成功，但 VM 上的 script 沒有跑到最後"
            exit 1
          fi

      - name: Smoke test test 環境
        run: |
          set -euo pipefail
          BASE="http://${{ vars.VM_PUBLIC_IP }}:8080"
          EXPECTED="${{ github.sha }}"
          for i in $(seq 1 12); do
            if BODY="$(curl -fsS --max-time 5 "$BASE/api/info")"; then
              echo "$BODY"
              if printf '%s' "$BODY" | grep -q "$EXPECTED"; then
                echo "✅ test 環境已更新到 $EXPECTED"
                exit 0
              fi
              echo "服務有回應，但 build SHA 尚未更新為 $EXPECTED"
            fi
            echo "等待 test 服務更新中... ($i/12)"
            sleep 5
          done
          echo "❌ test 環境未回報預期的 build SHA"
          exit 1

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [ build, deploy-test ]
    environment:
      name: production
      url: http://${{ vars.VM_PUBLIC_IP }}:8081/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure VM is running
        run: |
          az vm start \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}"

      - name: Deploy to production
        env:
          JAR_URL: https://github.com/${{ github.repository }}/releases/download/build-${{ github.sha }}/simpleweb.jar
          SHA_URL: https://github.com/${{ github.repository }}/releases/download/build-${{ github.sha }}/simpleweb.jar.sha256
        run: |
          set -euo pipefail
          OUT="$(az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --parameters "$JAR_URL" "$SHA_URL" "prod" "simpleweb-prod" "${{ github.sha }}" \
            --scripts '
              # RunShellScript 用 /bin/sh 執行：POSIX 語法，沒有 pipefail。
              set -eu
              JAR_URL="$1"; SHA_URL="$2"; ENV_DIR="$3"; SERVICE="$4"; SHA="$5"
              STAGING="/opt/simpleweb/staging/$ENV_DIR"
              TARGET="/opt/simpleweb/$ENV_DIR"
              sudo mkdir -p "$STAGING" "$TARGET"
              sudo rm -f "$STAGING/simpleweb.jar" "$STAGING/simpleweb.jar.sha256"
              sudo curl -fsSL -o "$STAGING/simpleweb.jar" "$JAR_URL"
              sudo curl -fsSL -o "$STAGING/simpleweb.jar.sha256" "$SHA_URL"
              cd "$STAGING"
              sudo sha256sum -c simpleweb.jar.sha256
              if [ -f "$TARGET/simpleweb.jar" ]; then
                sudo cp -f "$TARGET/simpleweb.jar" "$TARGET/simpleweb.jar.previous"
              fi
              sudo install -m 0644 -o root -g root "$STAGING/simpleweb.jar" "$TARGET/simpleweb.jar"
              sudo touch "$TARGET/app.env"
              sudo sed -i "/^APP_BUILD_SHA=/d; /^APP_BUILD_TIME=/d" "$TARGET/app.env"
              printf "APP_BUILD_SHA=%s\nAPP_BUILD_TIME=%s\n" "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                | sudo tee -a "$TARGET/app.env" >/dev/null
              sudo chown root:root "$TARGET/app.env"
              sudo chmod 0644 "$TARGET/app.env"
              sudo systemctl restart "$SERVICE"
              sleep 5
              sudo systemctl is-active "$SERVICE"
              echo "DEPLOY_OK $SHA"
            ' \
            --query "value[].message" -o tsv)"
          echo "$OUT"
          if ! printf '%s' "$OUT" | grep -q "DEPLOY_OK ${{ github.sha }}"; then
            echo "❌ RunCommand 回報成功，但 VM 上的 script 沒有跑到最後"
            exit 1
          fi

      - name: Smoke test production 環境
        run: |
          set -euo pipefail
          BASE="http://${{ vars.VM_PUBLIC_IP }}:8081"
          EXPECTED="${{ github.sha }}"
          for i in $(seq 1 12); do
            if BODY="$(curl -fsS --max-time 5 "$BASE/api/info")"; then
              echo "$BODY"
              if printf '%s' "$BODY" | grep -q "$EXPECTED"; then
                echo "✅ production 環境已更新到 $EXPECTED"
                exit 0
              fi
              echo "服務有回應，但 build SHA 尚未更新為 $EXPECTED"
            fi
            echo "等待 production 服務更新中... ($i/12)"
            sleep 5
          done
          echo "❌ production 環境未回報預期的 build SHA"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Lab05 Production 部署"
            echo ""
            echo "- 核准者：需經由 environment \`production\` 的 required reviewer"
            echo "- Service: \`simpleweb-prod\`（port 8081）"
            echo "- URL: http://${{ vars.VM_PUBLIC_IP }}:8081/"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- 驗證: \`/api/info\` 必須回報同一個 commit SHA"
          } >> "$GITHUB_STEP_SUMMARY"
