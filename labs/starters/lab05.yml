# ---------------------------------------------------------------------------
# Lab 05 starter — Promote 到 production（含核准關卡）
#
# 目的地：.github/workflows/lab05-deploy-prod.yml
#
# 建議做法：先把你 Lab04 完成的 workflow 複製過來改名，
#           再依照下面的 TODO 加上第三個 job。
#
# 目標環境契約（不可改）：
#   test → simpleweb-test / 8080 / /opt/simpleweb/test/simpleweb.jar  + app.env
#   prod → simpleweb-prod / 8081 / /opt/simpleweb/prod/simpleweb.jar  + app.env
#
# ⚠️ 延續 Lab04 的三個實測重點：
#   1. VM 端 script 跑在 /bin/sh：只能 `set -eu`，不可 `set -euo pipefail`
#   2. VM 上沒有 unzip，完整性用 `sha256sum -c` + release 的 .sha256 sidecar
#   3. RunCommand 控制平面成功 ≠ script 成功；smoke test 必須驗到 commit SHA
# ---------------------------------------------------------------------------

name: Lab05 Promote to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# 與 Lab04 共用同一組，確保 test → production 的 artifact 不會被另一個 run 覆蓋。
concurrency:
  group: simpleweb-lab-deploy
  cancel-in-progress: false

jobs:
  # TODO 1: 把 Lab04 的 build job 原封不動搬過來
  #   （含 contents: write、sha256 sidecar，以及發佈 build-${{ github.sha }} 的步驟）
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify
      - name: Create SHA-256 checksum
        run: |
          set -euo pipefail
          cd target
          sha256sum simpleweb.jar > simpleweb.jar.sha256
          cat simpleweb.jar.sha256
      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: simpleweb-jar
          path: target/simpleweb.jar
          if-no-files-found: error
          retention-days: 1
      - name: Publish jar to rolling pre-release build-${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view build-${{ github.sha }} --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create build-${{ github.sha }} --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "build-${{ github.sha }}" \
              --notes "GH-200 lab 用的滾動式建置產出。"
          fi
          gh release upload build-${{ github.sha }} \
            target/simpleweb.jar target/simpleweb.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

