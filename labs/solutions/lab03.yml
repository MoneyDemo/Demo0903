name: Lab03 Package Artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: simpleweb-jar
          path: target/simpleweb.jar
          if-no-files-found: error
          retention-days: 1

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download jar
        uses: actions/download-artifact@v7
        with:
          name: simpleweb-jar
          path: downloaded

      - name: Inspect jar
        run: |
          set -euo pipefail
          ls -l downloaded
          test -f downloaded/simpleweb.jar || { echo "❌ 沒有拿到 simpleweb.jar"; exit 1; }
          echo "✅ 取得 jar：$(du -h downloaded/simpleweb.jar | cut -f1)"
          unzip -l downloaded/simpleweb.jar | head -n 20

      - name: Summary
        run: |
          {
            echo "## Lab03 Artifact 交接成功"
            echo ""
            echo "- build job 產生並上傳 \`simpleweb-jar\`"
            echo "- package job 下載後確認 \`downloaded/simpleweb.jar\` 存在"
          } >> "$GITHUB_STEP_SUMMARY"
