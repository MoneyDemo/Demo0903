name: Build

on: 
  push:
    branches: '*'
  workflow_dispatch: 

permissions:
  contents: read

env:
  buildConfig: Debug

jobs:
  build:
    name: Build Job
    runs-on: ubuntu-24.04-arm
    environment: Prod
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      
      - name: Build
        env:
          buildConfig: Release
        run: | 
             echo ${{ env.buildConfig }}
             echo ${{ vars.Account }}
             ./mvnw -B compile

      - name: Build
        run: | 
             echo ${{ env.buildConfig }}
             echo ${{ secrets.SMTPPASSWORD }}
             ./mvnw -B verify

      - name: Upload deployable jar
        uses: actions/upload-artifact@v7
        with:
          name: simpleweb-jar
          path: target/simpleweb.jar
          if-no-files-found: error
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 建置結果"
            echo ""
            echo "| 項目 | 內容 |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| 觸發事件 | \`${GITHUB_EVENT_NAME}\` |"
            echo "| 結果 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  
  deploy:
    runs-on: ubuntu-24.04
    environment: Test
    needs: build
    env:
      VM_PUBLIC_IP: "20.210.89.243"
    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v3.1.0
        with:
          name: simpleweb-jar
          path: target/

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ env.VM_PUBLIC_IP }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy jar to VM
        run: |
          scp -i ~/.ssh/id_deploy target/simpleweb.jar \
            azureuser@${{ env.VM_PUBLIC_IP }}:~/simpleweb.jar

      - name: Restart service on VM
        run: |
          ssh -i ~/.ssh/id_deploy azureuser@${{ env.VM_PUBLIC_IP }} \
            "set -euo pipefail
             sudo install -o simpleweb -g simpleweb -m 0644 ~/simpleweb.jar /opt/simpleweb/test/simpleweb.jar
             rm -f ~/simpleweb.jar
             printf 'APP_BUILD_SHA=%s\nAPP_BUILD_TIME=%s\n' '${{ github.sha }}' \"\$(date -u +%FT%TZ)\" | sudo tee /opt/simpleweb/test/app.env >/dev/null
             sudo systemctl restart simpleweb-test
             sleep 5
             sudo systemctl is-active simpleweb-test"
             
      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            curl -fsS "http://${{ env.VM_PUBLIC_IP }}:8080/api/info" && exit 0
            echo "等待應用程式啟動... ($i/10)" && sleep 6
          done
          exit 1

