# 修正重點：
#   `needs.build.outputs.jar-name` 只有在 build job 明確宣告 outputs 時才有值。
#   原始檔完全沒有 `outputs:` 區塊，所以 expression 求值結果是空字串，
#   download-artifact 收到空的 name 就失敗。
#   兩件事要一起做：
#     1. 給要被引用的 step 一個 `id:`
#     2. 在 job 層級宣告 `outputs:`，把 step 的輸出往上拋
#   （如果 artifact 名稱其實是固定的，最簡單的修法是直接寫死 name: simpleweb-jar，
#     但這個練習的目的是學會 job outputs 的正確寫法。）

name: Lab06 Broken 4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      jar-name: ${{ steps.name.outputs.jar-name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify

      - name: Decide artifact name
        id: name
        run: echo "jar-name=simpleweb-jar" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.jar-name }}
          path: target/simpleweb.jar
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download jar
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.jar-name }}
          path: downloaded

      - name: Inspect
        run: |
          set -euo pipefail
          ls -l downloaded
          test -f downloaded/simpleweb.jar
