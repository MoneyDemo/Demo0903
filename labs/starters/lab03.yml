# ---------------------------------------------------------------------------
# Lab 03 starter — 兩個 job + artifact 傳遞
#
# 目的地：.github/workflows/lab03-artifact.yml
#
# 情境：build job 產生 target/simpleweb.jar，
#       package job 透過 artifact 拿到那個 jar 並檢查它。
#       兩個 job 跑在「不同的 runner」上，檔案不會自動共用，
#       所以一定要用 artifact 傳遞。
# ---------------------------------------------------------------------------

name: Lab03 Package Artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify

