name: Build

on: 
  push:
    branches: '*'
  workflow_dispatch: 

permissions:
  contents: read

env:
  buildConfig: Debug

jobs:
  build:
    name: Build Job
    runs-on: ubuntu-24.04-arm
    environment: Prod
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      
      - name: Build
        env:
          buildConfig: Release
        run: | 
             echo ${{ env.buildConfig }}
             echo ${{ vars.Account }}
             ./mvnw -B compile

      - name: Build
        run: | 
             echo ${{ env.buildConfig }}
             echo ${{ secrets.SMTPPASSWORD }}
             ./mvnw -B verify

      - name: Test Report
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports
          if-no-files-found: warn

      - name: Upload deployable jar
        uses: actions/upload-artifact@v7
        with:
          name: simpleweb-jar
          path: target/simpleweb.jar
          if-no-files-found: error
          retention-days: 7

      - name: send fail email
        if: failure()
        run: echo 'send fail email'

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 建置結果"
            echo ""
            echo "| 項目 | 內容 |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| 觸發事件 | \`${GITHUB_EVENT_NAME}\` |"
            echo "| 結果 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  ajob:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Print
        run: echo bjob

  bjob:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Print
        run: echo ajob

  
  deploy:
    runs-on: ubuntu-24.04
    environment: Test
    needs:
      - build
      - ajob
      - bjob
    steps:
      - name: Print
        run: echo ${{ vars.Account }}
      

