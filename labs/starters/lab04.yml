# ---------------------------------------------------------------------------
# Lab 04 starter — 部署到 test 環境（OIDC + az vm run-command）
#
# 目的地：.github/workflows/lab04-deploy-test.yml
#
# 事前準備（講師會在課堂上給你實際值）：
#   Repository variables : AZURE_RESOURCE_GROUP / AZURE_VM_NAME / VM_PUBLIC_IP
#   Repository secrets   : AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#   GitHub Environment   : test
#   Repo 可見度          : public（VM 要匿名下載 release asset）
#
# 目標環境契約（不可改）：
#   test → systemd service `simpleweb-test`，port 8080，
#          jar 放在 /opt/simpleweb/test/simpleweb.jar
#          環境變數檔 /opt/simpleweb/test/app.env（systemd 讀這一份）
#
# ⚠️ 三個實測踩過的坑，starter 已經幫你避開，但你要知道為什麼：
#   1. `az vm run-command --command-id RunShellScript` 是用 **/bin/sh** 執行，
#      不是 bash。VM 端的 script 只能用 POSIX 語法：`set -eu`，
#      **不可以**寫 `set -euo pipefail`、`[[ ]]`、陣列。
#   2. VM 上只有 JRE，**不保證有 unzip**。完整性驗證改用 `sha256sum -c`
#      搭配 release 一併發佈的 .sha256 sidecar 檔。
#   3. RunCommand 的「控制平面成功」不等於「script 成功」。
#      script 結尾要 echo 一個標記，runner 端再自己 grep 驗證。
# ---------------------------------------------------------------------------

name: Lab04 Deploy to Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# workflow 層級維持最小權限，需要更多的 job 自己提升。
permissions:
  contents: read

# Lab04 與 Lab05 共用同一組，避免兩個 deployment 同時改 VM。
concurrency:
  group: simpleweb-lab-deploy
  cancel-in-progress: false

