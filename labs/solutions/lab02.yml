name: Lab02 Build and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build and test
        run: ./mvnw -B verify

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Lab02 Build 結果"
            echo ""
            echo "| 項目 | 值 |"
            echo "| --- | --- |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Run | #${{ github.run_number }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f target/simpleweb.jar ]; then
            echo "✅ 已產生 \`target/simpleweb.jar\`（$(du -h target/simpleweb.jar | cut -f1)）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 找不到 \`target/simpleweb.jar\`" >> "$GITHUB_STEP_SUMMARY"
          fi
